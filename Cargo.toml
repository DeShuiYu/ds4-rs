[package]
name = "ds4"
version = "0.1.0"
edition = "2021"
description = "DeepSeek V4 Flash inference engine (Rust port)"

[lib]
name = "ds4"
path = "src/lib.rs"

[[bin]]
name = "ds4"
path = "src/main.rs"

[[bin]]
name = "ds4-server"
path = "src/server_main.rs"

[dependencies]
memmap2 = "0.9"
byteorder = "1.5"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
httparse = "1.9"
ctrlc = "3.4"
rand = "0.8"
rand_distr = "0.4"

[build-dependencies]
cc = "1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ds4_no_metal)'] }

[features]
metal = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
